<!doctype html>
<html data-editor-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explainer Studio — React shell (Phase 5 preview)</title>
  <script>
    try {
      document.documentElement.dataset.editorTheme =
        localStorage.getItem('explainer-editor-theme') || 'dark';
    } catch (e) {}
  </script>
  <style>
    html, body { margin: 0; padding: 0; }
    #root:empty::after {
      content: 'loading editor…';
      display: block;
      padding: 40px;
      font-family: system-ui, sans-serif;
      color: #888;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- gif.js encoder (CDN once; exports report a readable offline error without it) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
